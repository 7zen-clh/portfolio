<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0e6e6f3.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><i class="fas fa-home"></i></li>
        <li><i class="fas fa-briefcase"></i></li>
        <li><i class="fas fa-stream"></i></li>
        <li><i class="fas fa-user"></i></li>
        <li><i class="fas fa-envelope"></i></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <img src="assets/img/unnamed.gif" alt="Photo de profil" class="avatar">
      <h1>L'efficacité d'un, le talent de trois. <span>Pourquoi chercher ailleurs ?</span></h1>
      <p class="subtitle">
        Développeur, directeur artistique et photographe, je fusionne technicité et esthétisme pour apporter une dimension unique à mon travail.
      </p>
      <p class="status"><span class="green-dot"></span> Disponible pour de nouvelles opportunités</p>
      <div class="socials">
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-x-twitter"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-spotify"></i></a>
      </div>
      <div class="cta-buttons">
        <a href="#" class="btn">Prenons contact <i class="fas fa-envelope"></i></a>
        <a href="#" class="btn">Prendre rendez-vous <i class="fas fa-calendar-alt"></i></a>
      </div>
    </section>
  </main>
</body>
</html>
