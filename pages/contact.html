    <main>
      <section class="section contact-section">
        <h2>Contactez-moi</h2>
        <!-- Formulaire de contact intégré avec Formspree -->
        <form action="https://formspree.io/f/mrbqglkd" method="POST" class="contact-form">
          <div class="input-group">
            <input type="text" name="nom" required placeholder=" " />
            <label>Nom</label>
          </div>
          <div class="input-group">
            <input type="email" name="email" required placeholder=" " />
            <label>Email</label>
          </div>
          <div class="input-group">
            <textarea name="message" required placeholder=" "></textarea>
            <label>Votre message</label>
          </div>
          <button type="submit" class="submit-btn">Envoyer</button>
        </form>
      </section>
    </main>
